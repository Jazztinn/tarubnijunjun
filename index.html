<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Tarub ni Jun Jun</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="mission-strip" aria-label="Scoreboard">
        <div class="mission-stat"><span class="label">SCORE</span><strong id="score">000000</strong></div>
        <div class="mission-stat"><span class="label">HIGH</span><strong id="high-score">000000</strong></div>
      </section>

      <section class="playfield-wrap">
        <div class="playfield-heading">
          <span id="wave-label">WAVE 01</span>
          <span id="wave-progress" aria-label="0 of 5 enemies defeated">0/5</span>
        </div>
        <div id="playfield" class="playfield" tabindex="0" aria-label="Tarub ni Jun Jun game area">
          <div class="hud-row">
            <div id="heart-hud" class="heart-hud" aria-label="Junjun health: 3 hearts" aria-live="polite">
              <div class="health-group" aria-hidden="true">
                <span class="heart-slot"><img class="heart is-full" src="./public/assets/hud-heart-alive.png" alt="" /></span>
                <span class="heart-slot"><img class="heart is-full" src="./public/assets/hud-heart-alive.png" alt="" /></span>
                <span class="heart-slot"><img class="heart is-full" src="./public/assets/hud-heart-alive.png" alt="" /></span>
              </div>
              <div class="hud-powerups">
                <div id="shield-status" class="shield-status is-hidden" aria-label="Shield active"><img class="powerup-status-icon" src="./public/assets/hud-shield.png" alt="" aria-hidden="true" /></div>
                <div id="growth-status" class="growth-status is-hidden" aria-label="Growth active"><img class="powerup-status-icon" src="./public/assets/hud-growth.png" alt="" aria-hidden="true" /></div>
                <div id="ammo-status" class="ammo-status is-hidden" aria-label="Ammo boost active"><img class="powerup-status-icon" src="./public/assets/hud-ammopack.png" alt="" aria-hidden="true" /></div>
                <div id="spread-status" class="spread-status is-hidden" aria-label="Spread shot active"><img class="powerup-status-icon" src="./public/assets/magazineenabled.png" alt="" aria-hidden="true" /></div>
              </div>
            </div>
            <div id="ammo-hud" class="ammo-hud" aria-label="Ammunition: 15 of 15">
              <span class="ammo-label">AMMO</span>
              <div id="ammo-pips" class="ammo-pips" aria-hidden="true">
                <i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i>
                <i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i>
                <i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i><i class="ammo-pip"></i>
              </div>
            </div>
          </div>
          <div id="game-world" class="game-world">
            <div class="clouds" aria-hidden="true"></div>
            <div id="enemy-layer" class="entity-layer" aria-hidden="true"></div>
            <div id="powerup-layer" class="entity-layer" aria-hidden="true"></div>
            <div id="projectile-layer" class="entity-layer" aria-hidden="true"></div>
            <img id="entry-scene" class="entry-scene" src="" alt="" aria-hidden="true" hidden />
            <div id="player" class="player" aria-label="Player ship">
              <div id="powerup-particle-layer" class="powerup-particle-layer" aria-hidden="true"></div>
              <div class="ship-slot">
                <img id="ship-sprite" class="ship-sprite" src="./public/assets/ship-idle.gif" alt="" width="100" height="100" />
              </div>
            </div>
            <div class="clouds clouds-foreground" aria-hidden="true"></div>
          </div>
          <div id="start-card" class="overlay-card">
            <h1>TARUB NI JUN JUN</h1>
            <button id="start-button" type="button">START GAME</button>
          </div>
          <div id="game-over-card" class="overlay-card is-hidden">
            <h2>Game Over.</h2>
            <p>Final score <strong id="final-score">000000</strong></p>
            <button id="restart-button" type="button">Play again</button>
          </div>
        </div>
      </section>

    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
